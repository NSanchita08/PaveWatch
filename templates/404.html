{% extends "base.html" %}

{% block title %}Page Not Found | PaveWatch{% endblock %}

{% block content %}
<div class="text-center py-5">
  <h1 class="display-1 fw-bold text-warning">404</h1>
  <h2 class="mb-4">Page Not Found</h2>
  <p class="text-muted col-md-6 mx-auto mb-4">
    The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
  </p>
  <a href="{% url 'home' %}" class="btn btn-warning px-4 py-2 fw-semibold">Return to Home</a>
</div>
{% endblock %}
