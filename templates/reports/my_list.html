{% extends "base.html" %}
{% block content %}
<h2>My Reports</h2>
<ul class="list-group mt-4">
  {% for report in reports %}
    <li class="list-group-item">
      <strong>{{ report.tracking_id }}</strong> - {{ report.get_status_display }} - {{ report.created_at|date:"Y-m-d H:i" }}
    </li>
  {% empty %}
    <li class="list-group-item">No reports submitted yet.</li>
  {% endfor %}
</ul>
{% endblock %}
