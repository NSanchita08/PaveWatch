{% extends "base.html" %}

{% block title %}Access Denied (403) | PaveWatch{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-6 text-center">
    <div class="card shadow-sm border-danger">
      <div class="card-body p-5">
        <h1 class="display-4 text-danger fw-bold">403</h1>
        <h3 class="card-title mb-3">Access Denied</h3>
        <p class="card-text text-muted">
          You do not have permission to access this page. This area requires specific officer, supervisor, or administrative privileges.
        </p>
        <div class="mt-4">
          <a href="{% url 'home' %}" class="btn btn-primary px-4">Return Home</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
